server:
  port: 8080
spring:
  application:
    name: core-api
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/dockvue?connectionTimeZone=UTC}
    username: ${MYSQL_USER:dockvue}
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
dockvue:
  media:
    endpoint: ${MEDIA_ENDPOINT:}
    browser-endpoint: ${MEDIA_BROWSER_ENDPOINT:}
    region: ${AWS_REGION:ap-northeast-2}
    worker-token: ${MEDIA_WORKER_TOKEN:}
    enabled: ${MEDIA_ENABLED:false}
    playback-key: ${MEDIA_PLAYBACK_KEY:}
  catalog:
    cursor-key: ${CATALOG_CURSOR_KEY:}
  auth:
    dev: ${AUTH_DEV:false}
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    origins: ${AUTH_ORIGINS:}
    private-key: ${AUTH_PRIVATE_KEY:}
    public-key: ${AUTH_PUBLIC_KEY:}
    previous-public-key: ${AUTH_PREVIOUS_PUBLIC_KEY:}
    issuer: ${AUTH_ISSUER:dockvue}
    audience: ${AUTH_AUDIENCE:dockvue-api}
    mail-from: ${SMTP_FROM:no-reply@dockvue.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
logging:
  structured:
    format:
      console: logstash
