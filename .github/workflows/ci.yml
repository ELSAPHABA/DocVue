name: DockVue CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-contracts.txt
      - run: python scripts/validate-contracts.py
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon check :services:core-api:bootJar :services:realtime-api:bootJar
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cp .env.example .env
      - run: docker compose --profile core config --quiet
      - run: docker compose --profile core up -d --build --wait --wait-timeout 300
      - run: python3 scripts/smoke.py
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/smoke-frontends.py
      - run: python3 scripts/auth-integration.py
        env:
          DOCKVUE_TEST_ALLOW_DB_FIXTURES: '1'
          DOCKVUE_TEST_REDIS_OUTAGE: '1'
      - run: npx playwright install --with-deps chromium
      - run: docker compose exec -T redis redis-cli FLUSHDB
      - run: npx playwright test
        env:
          DOCKVUE_TEST_ALLOW_DB_FIXTURES: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-phase03
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: failure()
        run: docker compose --profile core logs --no-color --tail 200
      - if: always()
        run: docker compose --profile core down -v --remove-orphans
